<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mather.host</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --fg: #1d1d1b;
      --muted: #6b6a64;
      --accent: #2f6f5e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --fg: #ecebe6;
        --muted: #9a9890;
        --accent: #6fc2a8;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 32rem; text-align: center; }
    h1 {
      margin: 0 0 0.25em;
      font-size: clamp(2rem, 8vw, 3.25rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>mather<span>.host</span></h1>
    <p>Site under construction &mdash; check back soon.</p>
  </main>
</body>
</html>
